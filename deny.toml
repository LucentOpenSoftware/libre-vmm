# cargo-deny configuration for Libre VMM
# https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny check

[advisories]
# Treat security advisories as errors (must fix before release).
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
# Allowlist of acceptable licenses for dependencies.
# All must be GPL-3-or-later compatible.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Add specific crates we don't want to depend on.
    # Example: { name = "openssl-sys" }  # we prefer rustls
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
