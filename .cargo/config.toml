# Cargo configuration for Libre VMM.
#
# This file is intentionally minimal. The local-libvirt build workaround
# (used when distribution `libvirt-dev` packages are unavailable) is
# handled by `build.sh`, which sets `PKG_CONFIG_PATH` to point at the
# in-tree `lib/pkgconfig/libvirt.pc`. There is no per-machine path
# stored here.
