name: Bug Report
description: Something is broken or behaves incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: checkboxes
    id: prereqs
    attributes:
      label: Prerequisites
      options:
        - label: I have searched the existing issues and not found a duplicate
          required: true
        - label: I am running the latest published version (or main branch)
          required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vmm --version` (or `cat target/release/vmm-cli --version`)
      placeholder: "vmm 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: distro
    attributes:
      label: Distribution
      options:
        - Debian
        - Ubuntu
        - Fedora
        - RHEL/AlmaLinux/Rocky
        - Arch
        - openSUSE
        - Flatpak
        - Other (specify in details)
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: Output of `uname -r`
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear, concise description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps to trigger the bug
      placeholder: |
        1. Open libre-vmm
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `RUST_LOG=debug libre-vmm 2>&1 | tail -100`
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
