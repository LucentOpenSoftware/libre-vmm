name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config libgtk-3-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run vmm-types tests
        run: cargo test --lib -p vmm-types

      - name: Run vmm-core tests
        run: cargo test --lib -p vmm-core

      - name: Run vmm-api tests
        run: cargo test --lib -p vmm-api

      - name: Build release binaries
        run: cargo build --release --workspace

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  windows-cross-types:
    name: Windows cross-compile (vmm-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo check -p vmm-types --target x86_64-pc-windows-gnu

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  api-spec-check:
    name: OpenAPI spec freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate OpenAPI spec
        run: cargo run --bin gen_openapi -p vmm-api
      - name: Verify spec is up to date
        run: |
          if ! git diff --quiet docs/openapi.json; then
            echo "::error::OpenAPI spec is out of date. Run 'cargo run --bin gen_openapi -p vmm-api' and commit."
            git diff docs/openapi.json
            exit 1
          fi
