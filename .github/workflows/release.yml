name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true

jobs:
  build-linux:
    name: Build Linux release artifacts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config libgtk-3-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release --workspace
      - name: Strip binaries
        run: |
          strip target/release/vmm-gui
          strip target/release/vmm-cli
          strip target/release/vmm-api
      - name: Package tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p libre-vmm-${VERSION}-linux-x86_64
          cp target/release/{vmm-gui,vmm-cli,vmm-api} libre-vmm-${VERSION}-linux-x86_64/
          cp libre-vmm.desktop README.md LICENSE CHANGELOG.md libre-vmm-${VERSION}-linux-x86_64/
          cp -r packaging libre-vmm-${VERSION}-linux-x86_64/
          tar czf libre-vmm-${VERSION}-linux-x86_64.tar.gz libre-vmm-${VERSION}-linux-x86_64
          sha256sum libre-vmm-${VERSION}-linux-x86_64.tar.gz > libre-vmm-${VERSION}-linux-x86_64.tar.gz.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            libre-vmm-*.tar.gz
            libre-vmm-*.sha256

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-22.04
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dh-cargo libvirt-dev pkg-config libgtk-3-dev
      - name: Symlink packaging/debian to ./debian
        run: ln -s packaging/debian debian
      - name: Build .deb (unsigned)
        run: dpkg-buildpackage -b -us -uc
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: ../*.deb

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-22.04
    container: fedora:40
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: dnf install -y rust cargo libvirt-devel gtk3-devel pkgconfig rpm-build
      - name: Build .rpm
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          git archive --format=tar.gz --prefix=libre-vmm-0.1.0/ HEAD -o ~/rpmbuild/SOURCES/libre-vmm-0.1.0.tar.gz
          rpmbuild -ba packaging/rpm/libre-vmm.spec
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: ~/rpmbuild/RPMS/x86_64/*.rpm

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-deb, build-rpm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Generate release notes from CHANGELOG
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk "/^## \\[${VERSION}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/linux-x86_64/*
            artifacts/deb/*
            artifacts/rpm/*
          draft: true
          prerelease: true
